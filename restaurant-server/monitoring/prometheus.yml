global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: 'restaurant-cluster'
    environment: 'production'

# 告警规则文件
rule_files:
  # - 'alerts/*.yml'

scrape_configs:
  # Gateway Service
  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['gateway:8080']
        labels:
          application: 'restaurant-gateway'
          service: 'gateway'
          tier: 'gateway'

  # Order Service
  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['order-service:8081']
        labels:
          application: 'restaurant-order'
          service: 'order'
          tier: 'backend'

  # Dish Service
  - job_name: 'dish-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['dish-service:8082']
        labels:
          application: 'restaurant-dish'
          service: 'dish'
          tier: 'backend'

  # Member Service
  - job_name: 'member-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['member-service:8083']
        labels:
          application: 'restaurant-member'
          service: 'member'
          tier: 'backend'

  # Admin Service
  - job_name: 'admin-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['admin-service:8084']
        labels:
          application: 'restaurant-admin'
          service: 'admin'
          tier: 'backend'

  # Prometheus自监控
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          application: 'prometheus'
          service: 'monitoring'
