services:
  seata-server:
    image: seataio/seata-server:1.7.0
    container_name: restaurant-seata-server
    ports:
      - "8091:8091"
    environment:
      SEATA_PORT: 8091
      STORE_MODE: file
    restart: unless-stopped
    networks:
      - restaurant-network

networks:
  restaurant-network:
    external: true
    name: restaurant-server_restaurant-network
