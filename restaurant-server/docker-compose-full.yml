version: '3.8'

services:
  # ==================== 基础设施服务 ====================
  
  # MySQL主库
  mysql-master:
    image: mysql:8.0
    container_name: restaurant-mysql-master
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: restaurant_db
      MYSQL_USER: restaurant
      MYSQL_PASSWORD: restaurant123
    ports:
      - "3306:3306"
    volumes:
      - mysql-master-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis
  redis:
    image: redis:7.2-alpine
    container_name: restaurant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass redis123
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: restaurant-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Nacos
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: restaurant-nacos
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: embedded
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Sentinel Dashboard
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: restaurant-sentinel-dashboard
    environment:
      JAVA_OPTS: "-Xms512m -Xmx512m"
      auth.username: sentinel
      auth.password: sentinel123
    ports:
      - "8858:8858"
    networks:
      - restaurant-network
    restart: unless-stopped

  # Seata Server
  seata-server:
    image: seataio/seata-server:1.7.0
    container_name: restaurant-seata-server
    environment:
      SEATA_PORT: 8091
      STORE_MODE: file
    ports:
      - "8091:8091"
    networks:
      - restaurant-network
    restart: unless-stopped

  skywalking-elasticsearch:
    image: elasticsearch:8.11.0
    container_name: restaurant-skywalking-elasticsearch
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - skywalking-es-data:/usr/share/elasticsearch/data
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  skywalking-oap:
    image: apache/skywalking-oap-server:9.6.0
    container_name: restaurant-skywalking-oap
    environment:
      SW_STORAGE: elasticsearch
      SW_STORAGE_ES_CLUSTER_NODES: skywalking-elasticsearch:9200
      SW_HEALTH_CHECKER: default
      SW_TELEMETRY: prometheus
      SW_CORE_GRPC_PORT: 11800
      SW_CORE_REST_PORT: 12800
      JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "11800:11800"
      - "12800:12800"
    depends_on:
      skywalking-elasticsearch:
        condition: service_healthy
    networks:
      - restaurant-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:12800/internal/l7check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  skywalking-ui:
    image: apache/skywalking-ui:9.6.0
    container_name: restaurant-skywalking-ui
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
      SW_ZIPKIN_ADDRESS: http://skywalking-oap:9412
    ports:
      - "8090:8080"
    depends_on:
      skywalking-oap:
        condition: service_healthy
    networks:
      - restaurant-network
    restart: unless-stopped

  # ==================== 应用服务 ====================

  # Gateway Service
  gateway:
    build:
      context: ../restaurant-gateway
      dockerfile: Dockerfile
    container_name: restaurant-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      SENTINEL_DASHBOARD: sentinel-dashboard:8858
      SKYWALKING_AGENT_ENABLED: "true"
      SKYWALKING_AGENT_OPTS: "-Dskywalking.agent.service_name=restaurant-gateway -Dskywalking.collector.backend_service=skywalking-oap:11800 -Dskywalking.agent.sample_n_per_3_secs=1 -Dskywalking.logging.level=INFO -Dskywalking.agent.namespace=restaurant -Dskywalking.agent.instance_name=gateway-$${HOSTNAME}"
    ports:
      - "8080:8080"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      sentinel-dashboard:
        condition: service_started
      skywalking-oap:
        condition: service_healthy
    networks:
      - restaurant-network
    volumes:
      - ./monitoring/skywalking/skywalking-agent:/skywalking/agent:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

  # Order Service
  order-service:
    build:
      context: ../restaurant-order
      dockerfile: Dockerfile
    container_name: restaurant-order
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: dev
      MYSQL_HOST: mysql-master
      MYSQL_PORT: 3306
      MYSQL_DATABASE: restaurant_db
      MYSQL_USER: restaurant
      MYSQL_PASSWORD: restaurant123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123
      SENTINEL_DASHBOARD: sentinel-dashboard:8858
      SEATA_SERVER_ADDR: seata-server:8091
      SKYWALKING_AGENT_ENABLED: "true"
      SKYWALKING_AGENT_OPTS: "-Dskywalking.agent.service_name=restaurant-order-service -Dskywalking.collector.backend_service=skywalking-oap:11800 -Dskywalking.agent.sample_n_per_3_secs=1 -Dskywalking.logging.level=INFO -Dskywalking.agent.namespace=restaurant -Dskywalking.agent.instance_name=order-$${HOSTNAME}"
    ports:
      - "8081:8081"
    depends_on:
      mysql-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      sentinel-dashboard:
        condition: service_started
      seata-server:
        condition: service_started
      skywalking-oap:
        condition: service_healthy
    networks:
      - restaurant-network
    volumes:
      - ./monitoring/skywalking/skywalking-agent:/skywalking/agent:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

  # Dish Service
  dish-service:
    build:
      context: ../restaurant-dish
      dockerfile: Dockerfile
    container_name: restaurant-dish
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: dev
      MYSQL_HOST: mysql-master
      MYSQL_PORT: 3306
      MYSQL_DATABASE: restaurant_db
      MYSQL_USER: restaurant
      MYSQL_PASSWORD: restaurant123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      SENTINEL_DASHBOARD: sentinel-dashboard:8858
      SEATA_SERVER_ADDR: seata-server:8091
      SKYWALKING_AGENT_ENABLED: "true"
      SKYWALKING_AGENT_OPTS: "-Dskywalking.agent.service_name=restaurant-dish-service -Dskywalking.collector.backend_service=skywalking-oap:11800 -Dskywalking.agent.sample_n_per_3_secs=1 -Dskywalking.logging.level=INFO -Dskywalking.agent.namespace=restaurant -Dskywalking.agent.instance_name=dish-$${HOSTNAME}"
    ports:
      - "8082:8082"
    depends_on:
      mysql-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      sentinel-dashboard:
        condition: service_started
      seata-server:
        condition: service_started
      skywalking-oap:
        condition: service_healthy
    networks:
      - restaurant-network
    volumes:
      - ./monitoring/skywalking/skywalking-agent:/skywalking/agent:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

  # Member Service
  member-service:
    build:
      context: ../restaurant-member
      dockerfile: Dockerfile
    container_name: restaurant-member
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: dev
      MYSQL_HOST: mysql-master
      MYSQL_PORT: 3306
      MYSQL_DATABASE: restaurant_db
      MYSQL_USER: restaurant
      MYSQL_PASSWORD: restaurant123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      SENTINEL_DASHBOARD: sentinel-dashboard:8858
      SKYWALKING_AGENT_ENABLED: "true"
      SKYWALKING_AGENT_OPTS: "-Dskywalking.agent.service_name=restaurant-member-service -Dskywalking.collector.backend_service=skywalking-oap:11800 -Dskywalking.agent.sample_n_per_3_secs=1 -Dskywalking.logging.level=INFO -Dskywalking.agent.namespace=restaurant -Dskywalking.agent.instance_name=member-$${HOSTNAME}"
    ports:
      - "8083:8083"
    depends_on:
      mysql-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      sentinel-dashboard:
        condition: service_started
      skywalking-oap:
        condition: service_healthy
    networks:
      - restaurant-network
    volumes:
      - ./monitoring/skywalking/skywalking-agent:/skywalking/agent:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

  # Admin Service
  admin-service:
    build:
      context: ../restaurant-admin-service
      dockerfile: Dockerfile
    container_name: restaurant-admin
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: dev
      MYSQL_HOST: mysql-master
      MYSQL_PORT: 3306
      MYSQL_DATABASE: restaurant_db
      MYSQL_USER: restaurant
      MYSQL_PASSWORD: restaurant123
      SENTINEL_DASHBOARD: sentinel-dashboard:8858
      SKYWALKING_AGENT_ENABLED: "true"
      SKYWALKING_AGENT_OPTS: "-Dskywalking.agent.service_name=restaurant-admin-service -Dskywalking.collector.backend_service=skywalking-oap:11800 -Dskywalking.agent.sample_n_per_3_secs=1 -Dskywalking.logging.level=INFO -Dskywalking.agent.namespace=restaurant -Dskywalking.agent.instance_name=admin-$${HOSTNAME}"
    ports:
      - "8084:8084"
    depends_on:
      mysql-master:
        condition: service_healthy
      nacos:
        condition: service_healthy
      sentinel-dashboard:
        condition: service_started
      skywalking-oap:
        condition: service_healthy
    networks:
      - restaurant-network
    volumes:
      - ./monitoring/skywalking/skywalking-agent:/skywalking/agent:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

  # ==================== 监控服务 ====================

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: restaurant-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - restaurant-network
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:10.2.0
    container_name: restaurant-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: ''
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - restaurant-network
    restart: unless-stopped

# ==================== 数据卷 ====================
volumes:
  mysql-master-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  nacos-data:
    driver: local
  nacos-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  skywalking-es-data:
    driver: local

# ==================== 网络 ====================
networks:
  restaurant-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
